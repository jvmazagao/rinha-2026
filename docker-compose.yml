services:
  nginx:
    image: nginx:1.27-alpine
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      - "9999:9999"
    depends_on:
      - api1
      - api2
    deploy:
      resources:
        limits:
          cpus: "0.15"
          memory: "30MB"
    networks:
      - backend

  api1:
    image: ghcr.io/jvmazagao/rinha-2026:submission
    environment:
      - GOMAXPROCS=1
    deploy:
      resources:
        limits:
          cpus: "0.40"
          memory: "150MB"
    networks:
      - backend

  api2:
    image: ghcr.io/jvmazagao/rinha-2026:submission
    environment:
      - GOMAXPROCS=1
    deploy:
      resources:
        limits:
          cpus: "0.40"
          memory: "150MB"
    networks:
      - backend

networks:
  backend:
    driver: bridge
