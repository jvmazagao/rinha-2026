services:
  nginx:
    image: nginx:1.27-alpine
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      - "9999:9999"
    depends_on:
      - api1
      - api2
    deploy:
      resources:
        limits:
          cpus: "0.15"
          memory: "30MB"
    networks:
      - backend

  api1:
    build: .
    environment:
      - GOMAXPROCS=1
    deploy:
      resources:
        limits:
          cpus: "0.40"
          memory: "150MB"
    networks:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:9999/ready || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

  api2:
    build: .
    environment:
      - GOMAXPROCS=1
    deploy:
      resources:
        limits:
          cpus: "0.40"
          memory: "150MB"
    networks:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:9999/ready || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

networks:
  backend:
    driver: bridge
